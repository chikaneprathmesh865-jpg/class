<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Gradient Overlay</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f2f2f2;
      font-family: Arial, sans-serif;
    }

    .image-card {
      width: 350px;
      height: 220px;
      position: relative;
      background-image:
        linear-gradient(to top, rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0)),
        url("https://picsum.photos/600/400");
      background-size: cover;
      background-position: center;
      border-radius: 12px;
      overflow: hidden;
      color: white;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .image-card .content {
      position: absolute;
      bottom: 15px;
      left: 15px;
    }

    .image-card h2 {
      margin: 0;
      font-size: 22px;
    }

    .image-card p {
      margin: 5px 0 0;
      font-size: 14px;
      opacity: 0.9;
    }
  </style>
</head>

<body>

  <div class="image-card">
    <div class="content">
      <h2>Nature View</h2>
      <p>Beautiful gradient overlay effect</p>
    </div>
  </div>

</body>
</html>

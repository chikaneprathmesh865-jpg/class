<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>
body{
     background: linear-gradient(135deg, #8e24aa, #ec407a);
            min-height: 100vh;
}

.container{
    width:50%;
    margin:50px auto;
    background:white;
    padding:20px;
    border-radius:10px;
}

h1{
    text-align: left;
    margin-bottom: 20px;
    font-size: 26px;
    font-weight: bold;
}

.grid-container{
    display:grid;
    grid-template-columns:auto auto;
    gap:20px;
}

.grid-container1{
    display:grid;
    grid-template-columns:auto;
    gap:15px;
    margin-top:15px;
}

.item{
    display:grid;
    gap:6px;
}

label{
    font-size:14px;
    font-weight:600;
}

input, select{
    height:30px;
    padding:4px;
    font-size:14px;
}


.radio{
    display:flex;
    align-items:center;
    gap:10px;
}

.submit{
    width:120px;
    height:35px;
    background:#0baded;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.submit:hover{
    background:#055f82;
}
</style>
</head>

<body>

<div class="container">
    <h1>Registration form</h1>

    <div class="grid-container">
        <!-- left -->
        <div class="item">
            <label>First Name</label>
            <input type="text">

            <label>Birthday</label>
            <input type="date">

            <label>Email</label>
            <input type="email">
        </div>

        <!-- right -->
        <div class="item">
            <label>Last Name</label>
            <input type="text">

            <label>Gender</label>
            <div class="radio">
                <input type="radio" name="gender"> Male
                <input type="radio" name="gender"> Female
            </div>

            <label>Phone Number</label>
            <input type="tel">
        </div>
    </div>

    <div class="grid-container1">
        <div class="item">
            <label>Subject</label>
            <select>
                <option>Subject</option>
                <option>Math</option>
                <option>Science</option>
                <option>English</option>
            </select>
        </div>

        <div class="item">
            <input type="submit" value="Submit" class="submit">
        </div>
    </div>

</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>

    <style>
        .container {
            width: 50%;
            margin: auto;
            margin-top: 30px;
            padding: 15px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: 24% 24% 24% 24%;
            gap: 8px;
        }

        .item {
            border: 1px solid black;
            border-radius: 5px;
            overflow: hidden; 
            height: 120px;
        }

        .item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
